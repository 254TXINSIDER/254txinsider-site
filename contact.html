<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Send a news tip, pitch a podcast guest, or ask about advertising with 254 Texas Insider.">
<meta property="og:title" content="Contact & News Tips | 254 Texas Insider">
<meta property="og:description" content="Send a news tip, pitch a podcast guest, or ask about advertising with 254 Texas Insider.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://254txinsider.com/assets/logo.webp">
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">

<body data-page="contact">
<div id="site-header"></div>
<main>
<div class="page-hero"><div class="wrap"><span class="kicker">Contact</span><h1>Send Us a <span>Tip</span></h1><p>News tips, podcast guests, advertising: it all comes here.</p></div></div>
<section class="block"><div class="wrap" style="max-width:760px">
  <form class="form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="thanks.html">
    <input type="hidden" name="form-name" value="contact">
    <p class="hidden"><label>Don't fill this out: <input name="bot-field"></label></p>
    <label>Name <input name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Topic
      <select name="topic" id="topic">
        <option value="tip">News tip</option>
        <option value="podcast">Podcast guest</option>
        <option value="advertise">Advertising</option>
        <option value="other">Something else</option>
      </select>
    </label>
    <label>Message <textarea name="message" required></textarea></label>
    <div><button class="btn" type="submit">Send</button></div>
  </form>
</div></section></main>
<div id="site-footer"></div>
</body>
</html>
